specVersion: v1alpha1
requiredAPIs:
  - api: cloudscheduler.googleapis.com
    reason: Needed for scheduled functions (keep_warm).
endpoints:
  main:
    region:
      - us-central1
    platform: gcfv2
    entryPoint: main
    httpsTrigger: {}
    cpu: 1
    timeoutSeconds: 540
    availableMemoryMb: 512
    minInstances: 0
    maxInstances: 100
    concurrency: 80
  # WhatsApp assistant worker: runs when the webhook stores a message in whatsapp_inbox
  # (this file is the source of truth for the CLI: new functions MUST be listed here too)
  whatsapp_inbox_worker:
    region:
      - us-central1
    platform: gcfv2
    entryPoint: whatsapp_inbox_worker
    eventTrigger:
      eventType: google.cloud.firestore.document.v1.created
      retry: false
      eventFilters:
        database: (default)
        namespace: (default)
      eventFilterPathPatterns:
        document: whatsapp_inbox/{message_sid}
    cpu: 1
    timeoutSeconds: 300
    availableMemoryMb: 512
    minInstances: 0
    maxInstances: 10
  # Keeps main and the WhatsApp worker warm in working hours for free (services/keep_warm.py)
  keep_warm:
    region:
      - us-central1
    platform: gcfv2
    entryPoint: keep_warm
    scheduleTrigger:
      schedule: '*/4 7-23 * * *'
      timeZone: America/Santiago
      retryConfig: {}
    cpu: 1
    timeoutSeconds: 60
    availableMemoryMb: 512
    minInstances: 0
    maxInstances: 1
  # Daily WhatsApp digest for the admin, 10:00 Chile time (services/proactive_service.py)
  whatsapp_daily_digest:
    region:
      - us-central1
    platform: gcfv2
    entryPoint: whatsapp_daily_digest
    scheduleTrigger:
      schedule: '0 10 * * *'
      timeZone: America/Santiago
      retryConfig: {}
    cpu: 1
    timeoutSeconds: 120
    availableMemoryMb: 512
    minInstances: 0
    maxInstances: 1
